# Winland shortcuts. Syntax:
#   bind = <MODS... KEY>, <action>
# MODS: SUPER (required), SHIFT, ALT, CTRL.  The last token before the comma is the key.
# Action:
#   <name> <args>   if "<name>.ps1" exists next to Winland.exe, that script runs with <args>
#   <command> ...   otherwise the whole line is executed as a command
# Examples:
#   bind = SUPER SHIFT B, launch-or-focus firefox   -> runs launch-or-focus.ps1 firefox
#   bind = SUPER RETURN, wt.exe -d E:\               -> executes wt.exe

# Re-register default Windows functionality that we turn off via the NoWinKeys policy.
bind = SUPER E, explorer.exe
bind = SUPER SHIFT S, ms-screenclip:

# App shortcuts.
bind = SUPER RETURN, wt.exe -d E:\
bind = SUPER SHIFT B, firefox
bind = SUPER SHIFT N, code
bind = SUPER SHIFT A, launch-web https://gemini.google.com
# bind = SUPER SHIFT C, launch-web https://chatgpt.com
bind = SUPER SHIFT M, launch-or-focus spotify
bind = SUPER SHIFT T, launch-or-focus taskmgr
