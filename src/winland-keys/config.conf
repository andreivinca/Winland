# Winland keys daemon — shortcut config. Syntax:
#   bind = <MODS... KEY>, <command>
# MODS: SUPER (required), SHIFT, ALT, CTRL.  The last token before the comma is the key.
# <command> runs when the combo is pressed. Its first word is resolved next to the exe as:
#   <word>.ps1  -> run that PowerShell script with the rest as arguments
#   <word>.exe  -> run that program directly (this is how winlandctl is found)
#   otherwise   -> run the whole line as a shell command (firefox, explorer.exe, a URI, ...)
#
# Workspaces and window focus live in the winland-env service; we drive it with winlandctl.

# --- Environment control (winland-env, via winlandctl) ---
bind = SUPER 1, winlandctl workspace 1
bind = SUPER 2, winlandctl workspace 2
bind = SUPER 3, winlandctl workspace 3
bind = SUPER 4, winlandctl workspace 4
bind = SUPER 5, winlandctl workspace 5
bind = SUPER 6, winlandctl workspace 6
bind = SUPER 7, winlandctl workspace 7
bind = SUPER 8, winlandctl workspace 8
bind = SUPER 9, winlandctl workspace 9

bind = SUPER NUMPAD1, winlandctl workspace 1
bind = SUPER NUMPAD2, winlandctl workspace 2
bind = SUPER NUMPAD3, winlandctl workspace 3
bind = SUPER NUMPAD4, winlandctl workspace 4
bind = SUPER NUMPAD5, winlandctl workspace 5
bind = SUPER NUMPAD6, winlandctl workspace 6
bind = SUPER NUMPAD7, winlandctl workspace 7
bind = SUPER NUMPAD8, winlandctl workspace 8
bind = SUPER NUMPAD9, winlandctl workspace 9

# Workspaces 11-19 — Super+Alt+N = workspace 10+N. (Workspaces aren't capped; extend the same way.)
bind = SUPER ALT 1, winlandctl workspace 11
bind = SUPER ALT 2, winlandctl workspace 12
bind = SUPER ALT 3, winlandctl workspace 13
bind = SUPER ALT 4, winlandctl workspace 14
bind = SUPER ALT 5, winlandctl workspace 15
bind = SUPER ALT 6, winlandctl workspace 16
bind = SUPER ALT 7, winlandctl workspace 17
bind = SUPER ALT 8, winlandctl workspace 18
bind = SUPER ALT 9, winlandctl workspace 19
bind = SUPER ALT NUMPAD1, winlandctl workspace 11
bind = SUPER ALT NUMPAD2, winlandctl workspace 12
bind = SUPER ALT NUMPAD3, winlandctl workspace 13
bind = SUPER ALT NUMPAD4, winlandctl workspace 14
bind = SUPER ALT NUMPAD5, winlandctl workspace 15
bind = SUPER ALT NUMPAD6, winlandctl workspace 16
bind = SUPER ALT NUMPAD7, winlandctl workspace 17
bind = SUPER ALT NUMPAD8, winlandctl workspace 18
bind = SUPER ALT NUMPAD9, winlandctl workspace 19

bind = SUPER LEFT, winlandctl focus left
bind = SUPER RIGHT, winlandctl focus right
bind = SUPER UP, winlandctl focus up
bind = SUPER DOWN, winlandctl focus down
bind = SUPER W, winlandctl close
bind = SUPER SHIFT W, winlandctl workspace-release

# --- Re-register default Windows functionality (the NoWinKeys policy turns these off) ---
bind = SUPER E, explorer.exe
bind = SUPER D, show-desktop
bind = SUPER SHIFT S, ms-screenclip:

# --- App shortcuts ---
bind = SUPER RETURN, launch-or-focus wt.exe WindowsTerminal -- -d E:\WinLand
bind = SUPER SHIFT B, firefox
bind = SUPER SHIFT N, code
bind = SUPER SHIFT A, launch-web https://gemini.google.com
# bind = SUPER SHIFT C, launch-web https://chatgpt.com
bind = SUPER SHIFT M, launch-or-focus spotify
bind = SUPER SHIFT T, launch-or-focus taskmgr
