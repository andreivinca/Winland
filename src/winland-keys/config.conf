bind = SUPER LEFT, winlandctl focus left
bind = SUPER RIGHT, winlandctl focus right
bind = SUPER UP, winlandctl focus up
bind = SUPER DOWN, winlandctl focus down
bind = SUPER W, winlandctl close
bind = SUPER SHIFT W, winlandctl workspace-release

# --- Tiling ---
# Windows are normal Windows windows until you tile them (apps opened by the shortcuts below are tiled
# automatically). Win+T tiles the focused window into the workspace shown on its monitor: the
# workspace's tiles stand side by side and share the monitor, and once they no longer fit the row
# scrolls (Win+Left/Right step through it). Dragging a tile with the mouse makes it float where you put
# it, still in its workspace. Win+T on a window:
#   - in no workspace: tiles it into the workspace shown on its monitor;
#   - floating (dragged out): puts it back into its own workspace's row, even from another monitor;
#   - a tile: unlinks it from its workspace — a normal window again.
# Win+Shift+Space unlinks any window from its workspace, floating or tiled.
bind = SUPER T, winlandctl toggle-tile
bind = SUPER SHIFT SPACE, winlandctl unlink
# Move the focused tile along its row (from either end, onto the next monitor). A window that isn't a
# tile hops to the next monitor.
bind = SUPER SHIFT LEFT, winlandctl move-window left
bind = SUPER SHIFT RIGHT, winlandctl move-window right

# Scratchpad: a roaming workspace with no home monitor. Win+S shows it on the monitor under the mouse
# (bringing its attached windows along); Win+S again hides it and restores that monitor's last workspace.
bind = SUPER S, winlandctl scratchpad

# Win combos not bound here keep their normal Windows meaning (Win+D, Win+E, Win+R, Win+Shift+S, ...).

# --- App shortcuts ---
bind = SUPER SHIFT F, explorer.exe
bind = SUPER RETURN, launch-or-focus wt.exe WindowsTerminal -- -d E:\WinLand
bind = SUPER SHIFT B, firefox
bind = SUPER SHIFT N, code
bind = SUPER SHIFT A, launch-or-focus-web https://gemini.google.com
# bind = SUPER SHIFT C, launch-web https://chatgpt.com
bind = SUPER SHIFT M, launch-or-focus spotify
bind = SUPER SHIFT T, launch-or-focus taskmgr
